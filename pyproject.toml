[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avicenna"
version = "0.3.6"
requires-python = ">=3.11"
dependencies = ["h5py"]

[project.scripts]
"vic.process"           = "avicenna.command_line.vic_process:main"
"vic.refine"            = "avicenna.command_line.vic_refine:main"
"vic.watch"             = "avicenna.command_line.vic_watch:main"
"vic.scrape"            = "avicenna.command_line.vic_scrape_logs:main"
"vic.pandda_prepare"    = "avicenna.command_line.vic_pandda_prepare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"avicenna.resources.scripts" = ["generate_XDS.INP"]
