[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avicenna"
version = "0.2.11"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
"vic.process" = "avicenna.command_line.vic_process:main"
"vic.watch"   = "avicenna.command_line.vic_watch:main"
"vic.scrape"  = "avicenna.command_line.vic_scrape_logs:main"

[tool.setuptools.packages.find]
where = ["src"]
